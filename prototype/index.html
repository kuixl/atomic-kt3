<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../media/icon.png" type="image/png"><title>Atomic Chat / прототип</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18191b;color:#eee;font:14px Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#242528;padding:12px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:5px;background:#383a3d;color:inherit;padding:9px 12px;cursor:pointer}button:hover{background:#4b4e53}button:focus-visible,select:focus-visible{outline:2px solid #72a7ff;outline-offset:2px}.active{background:#fff;color:#111}header strong{margin-right:10px}#hint{padding:12px 20px;color:#bcbec4;max-width:1150px;line-height:1.5;margin:auto}#screen{position:relative;margin:0 auto 30px;max-width:1440px;background:#050505;min-height:100px}#screen img{width:100%;display:block}.hot{position:absolute;background:transparent;border-radius:3px;padding:0}.hot:hover{background:#72a7ff22}.show .hot{background:#72a7ff30;outline:1px solid #72a7ff}#state{font-weight:normal;color:#bcbec4}#extra{max-width:1440px;margin:12px auto;display:flex;gap:8px;padding:0 18px;flex-wrap:wrap}#notice{padding:12px 20px;color:#aaa;text-align:center}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:15px 24px;background:#eee;color:#111;border-radius:5px;z-index:9;display:none}.back{color:#f4f4ef;text-underline-offset:3px;margin-right:6px}#extra:empty{display:none}.hot:focus-visible{background:#72a7ff55}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}} </style><link rel="stylesheet" href="demo.css?v=4">
<header><a class="back" href="../">← К проекту</a><strong>Atomic Chat</strong><button id="land">Лендинг</button><button id="app">Приложение</button><select id="size" aria-label="Размер лендинга"><option value="desktop">Десктоп</option><option value="tablet">Планшет</option><option value="mobile">Телефон</option></select><button id="show">Показать переходы</button><button id="reset">Сначала</button><span id="state" aria-live="polite"></span></header>
<div id="hint"></div><div id="extra"></div><main id="screen"><p class="initial-frame" role="status">Открываю макет…</p></main><div id="notice">Кликабельная демонстрация по макетам. Скачивание и ответы показаны как сценарий интерфейса.</div><div id="toast" role="status"></div>
<script>
const names={'01':'Новый диалог','02':'Выбор модели','03':'Генерация','04':'Ответ','05':'Ошибка генерации','06':'Каталог моделей','07':'Ничего не найдено','08':'Загрузка каталога','09':'Облачное подключение','10':'Ошибка ключа','11':'Подключения MCP','12':'Инструменты Skills','13':'Новый проект','14':'Интеграции','15':'API остановлен','16':'API работает','17':'Настройки','18':'Вложения','19':'История','20':'Нет подключений','1':'Загрузка модели'};
let mode='landing',state='01',size='desktop',shown=false,timer;const sc=document.querySelector('#screen'),hint=document.querySelector('#hint'),extra=document.querySelector('#extra');
const nav=[['New Chat','01',88],['Models','06',128],['Cloud','09',169],['Plugins','11',208],['Connectors','11',247],['Skills','12',285],['New Project','13',324],['Integrations','14',364],['API','15',404],['History','19',483],['Settings','17',850]];
let sequence = 0;
let frameLayer, toolsLayer, advance;
const cache = new Map();
const sizes = {desktop:[1440,9794],tablet:[768,8534],mobile:[390,8052]};
const guidance = {
  '01':'Выбери модель сверху или отправь пример запроса кнопкой в поле ввода.',
  '02':'Выбери локальную модель. Облачные варианты открывают настройки подключения.',
  '03':'Запрос отправлен. Ответ появится автоматически, генерацию можно остановить.',
  '04':'Ответ в диалоге. Можно отправить ещё один запрос или открыть ветку ошибки.',
  '05':'Нажми Retry, чтобы повторить запрос, или вернись к выбору модели.',
  '06':'Открой загрузку модели или проверь пустой результат поиска.',
  '1':'Посмотри прогресс. Кнопка под панелью возвращает в чат после завершения.',
  '10':'Повтори подключение или вернись к локальной модели.'
};
function load(src) {
  if (!cache.has(src)) {
    const asset = new Image();
    asset.src = src;
    cache.set(src, asset.decode().catch(error => {cache.delete(src);throw error;}));
  }
  return cache.get(src);
}
function go(s){
  const resetScroll = mode !== 'app';
  mode='app'; state=s;
  render(resetScroll);
}
async function render(resetScroll = false) {
  clearTimeout(timer);
  const id = ++sequence;
  const nextMode = mode;
  const nextState = state;
  const nextSize = size;
  const source = nextMode === 'download' ? null
    : nextMode === 'menu' ? 'assets/menu.png'
    : nextMode === 'app' ? 'assets/final-'+nextState+'.png'
    : 'assets/'+nextSize+'.webp';
  sc.setAttribute('aria-busy','true');
  const frame = document.createElement('div');
  frame.className = 'demo-frame';
  const image = source ? new Image() : null;
  if (image) {
    const [width, height] = nextMode === 'app' ? [1440,900] : nextMode === 'menu' ? [390,844] : sizes[nextSize];
    image.width = width;
    image.height = height;
    image.src = source;
    try { await image.decode(); }
    catch {
      if (id !== sequence) return;
      hint.textContent = 'Макет не загрузился. Нажми «Сначала» или выбери раздел ещё раз.';
      if (!sc.querySelector('img')) sc.firstElementChild.textContent = 'Макет не загрузился.';
      sc.removeAttribute('aria-busy');
      return;
    }
  }
  if (id !== sequence) return;
  frameLayer = frame;
  toolsLayer = document.createDocumentFragment();
  advance = null;
  buildFrame(image);
  sc.replaceChildren(frame);
  extra.replaceChildren(toolsLayer);
  sc.removeAttribute('aria-busy');
  if (resetScroll) window.scrollTo(0,0);
  if (advance) {
    const target = advance;
    timer = setTimeout(() => {if (id === sequence) go(target);}, 1200);
  }
  const warm = {'01':['02','03'],'02':['01','03'],'03':['04','05'],'04':['05'],'05':['03'],'06':['1','07']};
  if (nextMode === 'app') (warm[nextState] || []).forEach(key => load('assets/final-'+key+'.png').catch(()=>{}));
  if (nextMode === 'landing') load('assets/final-01.png').catch(()=>{});
}
function hot(label,x,y,w,h,fn,baseW=1440,baseH=900){const b=document.createElement('button');b.className='hot';b.setAttribute('aria-label',label);b.title=label;b.style.cssText=`left:${x/baseW*100}%;top:${y/baseH*100}%;width:${w/baseW*100}%;height:${h/baseH*100}%`;b.onclick=fn;frameLayer.append(b)}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;toolsLayer.append(b)}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}
function download(){mode='download';render(true)}
function buildFrame(im) {
  sc.classList.toggle('show',shown);
  document.querySelector('#land').classList.toggle('active',mode!=='app');
  document.querySelector('#app').classList.toggle('active',mode==='app');
  document.querySelector('#size').style.display=mode==='app'?'none':'';
  sc.style.maxWidth=mode==='app'?'1440px':size==='desktop'?'1100px':size==='tablet'?'768px':'390px';
  if (im) frameLayer.append(im);
  if(mode==='download'){
    sc.style.maxWidth='700px';
    frameLayer.innerHTML='<div class="install-copy"><h1>Переход к установке</h1><p>Скачивание показано как переход. Открой приложение, чтобы выбрать модель и отправить первый запрос.</p></div>';
    btn('Открыть приложение',()=>go('01'));
    btn('Вернуться на лендинг',()=>{mode='landing';render(true)});
    hint.textContent='Скачивание → выбор модели → первый диалог';
    document.querySelector('#state').textContent='Скачивание';
    return;
  }
if(mode==='menu'){im.alt='Мобильное меню Atomic Chat';sc.style.maxWidth='390px';hot('Закрыть меню',330,16,40,40,()=>{mode='landing';render()},390,844);[105,170,235,300,365].forEach((y,i)=>hot('Раздел '+(i+1),12,y,365,45,()=>{mode='landing';render();sc.scrollIntoView();window.scrollBy(0,400+i*260)},390,844));hot('Скачать',20,764,350,48,download,390,844);btn('Закрыть меню',()=>{mode='landing';render()});hint.textContent='Выбери раздел или закрой меню.';document.querySelector('#state').textContent='Мобильное меню';return}
if(mode==='landing'){
  im.alt='Лендинг Atomic Chat';
  hint.textContent='Нажмите кнопку скачивания на макете. Размер лендинга можно переключить сверху.';
  document.querySelector('#state').textContent='Лендинг';
  btn('К скачиванию',download);
  btn('Посмотреть приложение',()=>go('01'));
  const layout = {
    desktop: [1440,9794, [531,400,214,58], [753,400,156,58], 957,5335],
    tablet: [768,8534, [180,317,244,48], [432,317,156,48], 725,4125],
    mobile: [390,8052, [20,322,350,48], [20,378,350,48], 748,3877]
  };
  const [width,height,install,cloud,models,downloadSection]=layout[size];
  const jump = y => window.scrollTo({top:window.scrollY+sc.getBoundingClientRect().top+y*sc.clientWidth/width-78,behavior:'smooth'});
  hot('Скачать Atomic Chat',...install,download,width,height);
  hot('Облачный режим',...cloud,()=>go('09'),width,height);
  btn('Модели на лендинге',()=>jump(models));
  btn('Блок установки',()=>jump(downloadSection));
  if(size!=='desktop'){
    btn('Открыть меню',()=>{mode='menu';render();window.scrollTo(0,0)});
    hot('Открыть мобильное меню',width-62,8,54,55,()=>{mode='menu';render();window.scrollTo(0,0)},width,height);
  }else{
    hot('Скачать из шапки',1257,8,100,50,download,width,height);
    hot('Модели',1080,8,75,50,()=>jump(models),width,height);
  }
  return;
}
im.alt=names[state];document.querySelector('#state').textContent=names[state];hint.textContent=guidance[state] || 'Выбери раздел на боковой панели или включи подсветку переходов.';
nav.forEach(([n,s,y])=>hot(n,12,y,188,36,()=>go(s)));
if(['01','02','03','04','05','18'].includes(state))hot('Выбрать модель',236,16,200,32,()=>go('02'));
if(state==='01'){hot('Отправить пример запроса',1083,489,40,40,()=>go('03'));btn('Отправить запрос',()=>go('03'));hot('Добавить файл',530,489,40,40,()=>go('18'))}
if(state==='02'){hot('Выбрать локальную модель',245,105,240,115,()=>go('01'));hot('Настроить облачную модель',245,247,240,130,()=>go('09'));btn('Выбрать локальную модель',()=>go('01'))}
if(state==='03'){hot('Остановить генерацию',1114,824,36,36,()=>go('05'));advance='04'}
if(['04','18'].includes(state)){hot('Отправить следующее сообщение',1114,824,36,36,()=>go('03'));btn('Показать ошибку генерации',()=>go('05'))}
if(state==='05'){hot('Повторить запрос',502,233,66,32,()=>go('03'));hot('Сменить модель',580,232,115,34,()=>go('02'));btn('Повторить',()=>go('03'));btn('Сменить модель',()=>go('02'))}
if(state==='06'){hot('Загрузить модель',1295,173,105,38,()=>go('1'));hot('Поиск без результата',236,12,1000,35,()=>go('07'));btn('Загрузить модель',()=>go('1'));btn('Пустой результат поиска',()=>go('07'));btn('Загрузка каталога',()=>go('08'))}
if(state==='1'){btn('Загрузка завершена: открыть чат',()=>go('01'));btn('Отменить загрузку',()=>go('06'))}
if(['07','08'].includes(state)){btn('Очистить поиск / открыть каталог',()=>go('06'));if(state==='08')advance='06'}
if(state==='09'){hot('Выбрать подключение',250,154,1138,37,()=>go('10'));btn('Проверить неверный ключ',()=>go('10'));btn('Использовать локальную модель',()=>go('01'))}
if(state==='10'){btn('Повторить настройку',()=>go('09'));btn('Использовать локальную модель',()=>go('01'))}
if(state==='11'){btn('Пустое состояние',()=>go('20'));btn('Инструменты',()=>go('12'))}
if(state==='20')btn('Каталог подключений',()=>go('11'));
if(state==='13'){btn('Создать проект',()=>{go('01');toast('Проект создан в демонстрационном сценарии')});btn('Отмена',()=>go('01'))}
if(state==='14'){btn('Открыть локальный API',()=>go('15'))}
if(state==='15'){hot('Запустить API',1310,13,112,36,()=>go('16'));btn('Запустить API',()=>go('16'))}
if(state==='16'){hot('Остановить API',1310,13,112,36,()=>go('15'));btn('Остановить API',()=>go('15'))}
if(state==='19')btn('Открыть диалог',()=>go('04'));
}
document.querySelector('#land').onclick=()=>{mode='landing';render();window.scrollTo(0,0)};document.querySelector('#app').onclick=()=>{go('01');window.scrollTo(0,0)};document.querySelector('#size').onchange=e=>{size=e.target.value;mode='landing';render()};document.querySelector('#reset').onclick=()=>{state='01';mode='landing';size='desktop';document.querySelector('#size').value=size;render();window.scrollTo(0,0)};document.querySelector('#show').onclick=()=>{shown=!shown;sc.classList.toggle('show',shown);document.querySelector('#show').textContent=shown?'Скрыть переходы':'Показать переходы'};window.addEventListener('keydown',e=>{if(e.key==='Escape'){mode==='menu'?(mode='landing',render()):go('01')}});const params=new URLSearchParams(location.search);const entry=params.get('step');if(params.get('view')==='download'){download()}else if(entry&&Object.hasOwn(names,entry)){go(entry)}else{if(matchMedia('(max-width: 600px)').matches){size='mobile';document.querySelector('#size').value=size}render()}
</script></html>
